<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ariza topshirish</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f2f5;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 400px;
        }
        h2 {
            text-align: center;
            color: #333;
        }
        input, button {
            width: 100%;
            padding: 12px;
            margin: 8px 0;
            border: 1px solid #ddd;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 16px;
        }
        input[type="file"] {
            padding: 8px;
        }
        button {
            background-color: #0088cc;
            color: white;
            border: none;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover {
            background-color: #006699;
        }
        .error {
            color: red;
            text-align: center;
            margin-top: 10px;
        }
        .success {
            color: green;
            text-align: center;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Ariza formasi</h2>
        <form id="applicationForm">
            <input type="hidden" name="user_id" id="user_id">
            <input type="text" name="ism" placeholder="Ism" required>
            <input type="text" name="familiya" placeholder="Familiya" required>
            <input type="number" name="yosh" placeholder="Yosh" required min="1" max="120">
            <input type="text" name="manzil" placeholder="Manzil" required>
            <input type="number" name="vazn" placeholder="Vazn (kg)" required step="0.1" min="1">
            <input type="file" name="image" accept="image/*" required>
            <button type="submit">Arizani yuborish</button>
        </form>
        <div id="message"></div>
    </div>

    <script>
        Telegram.WebApp.ready();
        const user = Telegram.WebApp.initDataUnsafe?.user;
        if (user && user.id) {
            document.getElementById('user_id').value = user.id;
        } else {
            document.getElementById('message').innerHTML = '<div class="error">Foydalanuvchi aniqlanmadi. Iltimos, bot orqali qayta urinib ko\'ring.</div>';
        }

        document.getElementById('applicationForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const form = e.target;
            const formData = new FormData(form);
            const messageDiv = document.getElementById('message');
            messageDiv.innerHTML = '';

            // Barcha maydonlarni tekshirish
            for (let [key, value] of formData.entries()) {
                if (key !== 'image' && !value.trim()) {
                    messageDiv.innerHTML = '<div class="error">Barcha maydonlarni to\'ldiring!</div>';
                    return;
                }
                if (key === 'image' && !value.name) {
                    messageDiv.innerHTML = '<div class="error">Rasm yuklang!</div>';
                    return;
                }
            }

            try {
                const response = await fetch('/submit', {
                    method: 'POST',
                    body: formData
                });
                const result = await response.json();
                if (response.ok && result.status === 'success') {
                    messageDiv.innerHTML = '<div class="success">Ariza muvaffaqiyatli yuborildi!</div>';
                    form.reset();
                } else {
                    messageDiv.innerHTML = `<div class="error">${result.message || 'Xatolik yuz berdi'}</div>`;
                }
            } catch (error) {
                messageDiv.innerHTML = '<div class="error">Server bilan bog\'lanib bo\'lmadi</div>';
            }
        });
    </script>
</body>
</html>
